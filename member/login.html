<!--@layout(/layout/basic/layout.html)-->
<div class="ap-login">
  <div class="login__card ap-form-width">
    <div class="section path" data-ez="module-1xovwkk-1" data-ez-module="user-defined/1"
      data-ez-name="USER DEFINED" data-ez-type="plain">
      <span>현재 위치</span>
      <ol>
        <li><a href="/">홈</a></li>
        <li title="현재 위치"><strong>로그인</strong></li>
      </ol>
    </div><!-- //path -->
    <h2 class="login__title">Login</h2>
    <p class="login__desc">Welcome back, FORB</p>
    <div module="member_login" id="{$member_login_module_id}" data-ez="contents-1kmtsa7-1">
      <!--@css(/css/module/member/login.css)-->
      <!--@js(/js/module/member/login.js)-->
      <!--
            $defaultReturnUrl = /index.html
            $forbidIpUrl = member/adminFail.html
        -->
      <fieldset class="form">
        <legend>회원로그인</legend>
        <div class="login__sns">
          <!-- <div class="sns_h">SNS 로그인</div> -->
          <div class="wrap_sns_log">
            <a href="#none" class="btnKakao {$display_kakao|display}" onclick="{$kakao_func_login}">
              <img src="https://forbmaster.cafe24.com/skin-skin15/SkinImg/img/icon_sns_kakao.svg" alt>
              카카오 간편 로그인
            </a>
            <a href="#none" class="btnNaver {$display_naver|display}" onclick="{$naver_func_login}">
              <img src="https://forbmaster.cafe24.com/skin-skin15/SkinImg/img/icon_sns_naver.svg" alt>
              네이버 간편 로그인
            </a>
            <a href="#none" class="btnGoogle {$display_line|display}" onclick="{$google_func_login}">
              <img src="https://forbmaster.cafe24.com/skin-skin15/SkinImg/img/icon_sns_google.svg" alt>
              구글 간편 로그인
            </a>
            <a href="#none" class="btnFacebook {$display_facebook|display}" onclick="{$facebook_func_login}">페이스북 로그인</a>
            <a href="#none" class="btnLine {$display_line|display}" onclick="{$line_func_login}">라인 로그인</a>
            <a href="#none" class="btnApple {$display_apple|display}" onclick="{$apple_func_login}">Apple로 로그인</a>
            <a href="#none" class="yahoojp {$display_yahoojp|display}" onclick="{$yahoojp_func_login}">Yahoo! JAPAN<br>ID로 로그인</a>
          </div>
        </div><!-- //login__sns -->
    
        <div class="login-divider">
          <span class="login-divider__line"></span>
          또는 ID 로그인 
          <span class="login-divider__line"></span>
        </div><!-- //login-divider -->
    
        <div class="login login__form">
          <label class="id ePlaceholder" title="{$login_id_type_text}">{$form.member_id}</label>
          <label class="password ePlaceholder" title="비밀번호">{$form.member_passwd}</label>
        </div><!-- //login -->
    
        <div class="wrap_find">
          <div class="login__security">
            {$form.member_check_save_id}
            <span class="secret">
              <input type="checkbox" id="secur_check" checked disabled>
            </span>
            <label for="secur_check">보안접속</label>
          </div><!-- //login__security -->
          <div class="login__find-id"><a href="/member/id/find_id.html">아이디 찾기</a></div>
          <div><a href="/member/passwd/find_passwd_info.html">비밀번호 찾기</a></div>
        </div><!-- //wrap_find -->
    
        <div class="login__button">
          <button class="btnSubmit gFull sizeL ap-btn ap-btn--primary ap-btn--lg" onclick="{$action_func_login}">로그인</button>
          <a href="/member/guest_order.html?noMemberOrder&returnUrl=%2Fmyshop%2Findex.html" class="login__guest-order">비회원주문조회</a>
          <!-- <div class="{$display_nomember|display}">비회원의 경우, 해당버튼을 통해 주문이 가능합니다.</div> -->
          <a href="{$returnUrl}" onclick="{$action_nomember_order}"
            class="btnNormal gFull sizeL ap-btn ap-btn--outline-gold ap-btn--lg {$display_nomember|display}">비회원 구매</a>
        </div><!-- //login__button -->
    
        <div class="login__util">
          <div class="login__util-text">아직 회원이 아니신가요?<br>포브의 다양한 혜택 경험해보세요.</div>
          <a href="/member/agreement.html" class="ap-btn ap-btn--outline ap-btn--lg">회원가입</a>
        </div><!-- //login__util -->
      </fieldset>
    </div>
  </div><!-- //ap-login__card -->
</div><!-- //ap-login -->
  <!--#ez="1/1"-->
  <script defer>
document.querySelector('#contents > .RTMB').style.display = 'none !important';
  </script>

<!--@layout(/layout/basic/layout.html)-->
<!--@css(/layout/basic/css/ap-member.css)-->
<div class="ap-member">
  <div class="ap-form__wrap">
    <div class="section path blind">
      <span>현재 위치</span>
      <ol>
        <li><a href="/">홈</a></li>
        <li title="현재 위치"><strong>비밀번호 찾기</strong></li>
      </ol>
    </div><!-- //path -->

    <div class="ap-member__titArea">
      <h2 class="ap-member__title">비밀번호 찾기</h2>
    </div><!-- //ap-member__titArea -->

    <div module="member_findpasswdresult" class="memberArea ap-member__section ap-member__find">
        <!--@css(/css/module/member/find_passwd_result.css)-->
        <div class="ec-base-box typeMember">
            <div class="complete">
                <div class="headDesc">
                  <p class="{$display_email_method|display}">등록된 이메일로<br>임시&nbsp;비밀번호를&nbsp;보내드렸어요.</p>
                  <p class="{$display_mobile_method|display}">등록된 휴대폰 번호로<br>임시&nbsp;비밀번호를&nbsp;보내드렸어요.</p>
                </div>
                <p class="description">
                  <span class="{$display_id_method|display}"><strong class="txtEm">{$id}</strong> 회원님, </span>임시 비밀번호를<br><strong class="txtEm"><span class="{$display_email_method|display}">{$email}</span><span class="{$display_mobile_method|display}">{$mobile}</span></strong>으로 보내드렸습니다.
                </p>
            </div>
        </div>
        <div class="ec-base-button gBottom">
            <a href="/member/login.html" class="ap-btn ap-btn--primary">로그인 하기</a>
        </div>
    </div>
  </div><!-- //ap-form__wrap -->
</div><!-- //ap-member -->

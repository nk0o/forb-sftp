<!--@layout(/layout/basic/layout.html)-->
<!--@css(/layout/basic/css/ap-member.css)-->
<div class="ap-member">
  <div class="ap-form__wrap">
    <div class="section path blind">
      <span>현재 위치</span>
      <ol>
        <li><a href="/">홈</a></li>
        <li title="현재 위치"><strong>비밀번호 찾기</strong></li>
      </ol>
    </div><!-- //path -->

    <div class="ap-member__titArea">
      <h2 class="ap-member__title">비밀번호 찾기</h2>
    </div><!-- //ap-member__titArea -->

    <div module="member_findpasswdmethod" class="memberArea memberArea ap-member__section ap-member__find">
        <!--@css(/css/module/member/find_passwd_method.css)-->
        <!--
            $nextURL = /member/passwd/find_passwd_result.html
        -->
        <div class="ec-base-box typeMember">
            <fieldset class="content">
                <legend>임시 비밀번호 전송</legend>
                <ul class="ec-base-desc gVer">
                    <li><strong class="term">임시 비밀번호</strong><span class="desc">{$form.passwd_method_type}</span></li>
                    <li id="{$passwd_method_email_info}"><strong class="term">이메일</strong><span class="desc"><strong class="txtEm">{$passwd_method_email}</strong></span></li>
                    <li id="{$passwd_method_mobile_info}"><strong class="term">휴대폰 번호</strong><span class="desc"><strong class="txtEm">{$passwd_method_mobile}</strong></span></li>
                </ul>
            </fieldset>
        </div>
        <div class="ec-base-button gBottom">
            <a href="#none" class="ap-btn ap-btn--outline" onclick="{$action_func_find_passwd_cancel}">취소</a>
            <a href="#none" class="ap-btn ap-btn--primary" onclick="{$action_func_find_passwd_send}">임시 비밀번호 전송</a>
        </div>
    </div>
  </div><!-- //ap-form__wrap -->
</div><!-- //ap-member -->

  /* ── STATE ─────────────────────────────────────────────────────────────────── */
  // prodId에 'all' 추가
  let S = { catId: CATS[0].id, prodId: 'all' };
  const cat = () => CATS.find(c => c.id === S.catId);
  const prod = () => {
    if (S.prodId === 'all') return null;
    return cat()?.products.find(p => p.id === S.prodId);
  };

  
  /* ── SIDEBAR ───────────────────────────────────────────────────────────────── */
  function renderSidebar() {
    const nav = document.getElementById('howtoNav');
    nav.innerHTML = CATS.map(c => `
      <div class="howto-nav__item swiper-slide">
        <button class="howto-cat__btn ${c.id===S.catId?'active':''}" data-cat="${c.id}">
          ${c.label}
          <span class="howto-cat__chevron"><!--@import(/svg/icon-chevron-right.html)--></span>
        </button>
      </div>
    `).join('');
  
    nav.querySelectorAll('.howto-cat__btn').forEach(b => b.addEventListener('click', () => {
      const c = CATS.find(x => x.id === b.dataset.cat);
      S = { catId: c.id, prodId: 'all' };
      render(); closeDrawer();
    }));
    nav.querySelectorAll('.howto-sidebar__prd').forEach(b => b.addEventListener('click', () => {
      S.catId=b.dataset.cat; S.prodId=b.dataset.prod;
      render(); closeDrawer();
    }));
  }

  /* ── MAIN ──────────────────────────────────────────────────────────────────── */
  function renderMain() {
    const main = document.getElementById('howtoMain');
    const c = cat();
    if (!c) return;

    // 전체면 모든 제품 영상 합치기, 아니면 해당 제품만
    const shown = S.prodId === 'all'
      ? c.products.flatMap(pr => pr.videos.map(v => ({ ...v, _prodLabel: pr.label })))
      : (cat()?.products.find(p => p.id === S.prodId)?.videos ?? []);

    main.innerHTML = `
      <div class="howto-header">
        <div class="howto-header__text">
          <h2>${c.label}</h2>
          <p>${c.desc || ''}</p>
        </div>
      </div>

      <div class="ap-tabs ap-tabs--category howto-cate__tabs">
        <button class="ap-cate__tab ${'all' === S.prodId ? 'active' : ''}"
                data-prod="all">
          전체
        </button>
        ${c.products.map(pr => `
          <button class="ap-cate__tab ${pr.id === S.prodId ? 'active' : ''}"
                  data-prod="${pr.id}">
            ${pr.label}
          </button>
        `).join('')}
      </div>

      <div>
        <div class="howto-video__header">
          <div class="howto__label">사용방법 영상</div>
          <span class="howto-video__count">총 ${shown.length}개</span>
        </div>
        ${shown.length ? `
        <div class="howto-video__grid">
          ${shown.map((v, i) => `
            <div class="howto-card" data-vi="${i}">
              <div class="howto-thumb">
                <div class="howto-thumb__glyph"><img src="${v.thumbnail}" alt="${v.title}"></div>
                <div class="play-ring"><div class="play-tri"></div></div>
                <span class="howto-thumb__dur">${v.dur}</span>                
              </div>
              <div class="howto-card__body">
                ${S.prodId === 'all' && v._prodLabel
                  ? `<span class="howto-thumb__prod">${v._prodLabel}</span>`
                  : ''}
                <h4>${v.title}</h4>
                <p>${v.desc}</p>
              </div>
            </div>
          `).join('')}
        </div>` : `
        <div class="howto-empty">
          <div class="howto-empty__icon">🔍</div>
          <p>영상이 없습니다.</p>
        </div>`}
      </div>
    `;

    main.querySelectorAll('.howto-cate__tabs .ap-cate__tab').forEach(b => b.addEventListener('click', () => {
      S.prodId = b.dataset.prod;
      render();
    }));

    main.querySelectorAll('.howto-thumb').forEach(thumb => thumb.addEventListener('click', () => {
      openModal(shown[+thumb.closest('.howto-card').dataset.vi], c);
    }));
  }
  /* ── MODAL ─────────────────────────────────────────────────────────────────── */
  function openModal(v,c){
    document.getElementById('modal-title').textContent=v.title;
    document.getElementById('modal-desc').textContent=v.desc;
    document.getElementById('modal-thumb').setAttribute( 'src', v.thumbnail)
    document.getElementById('modal-video').innerHTML=`<iframe src="https://www.youtube.com/embed/${v.url}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
   /*  const tags=document.getElementById('modal-tags');
    tags.innerHTML=''; */
    document.getElementById('modal-prod').innerHTML=` ${S.prodId === 'all' && v._prodLabel ? `<span class="howto-thumb__prod">${v._prodLabel}</span>` : ''}`;
    const d=document.createElement('span');d.className='modal-tag';
    document.getElementById('modal-overlay').classList.add('open');
  }

  const closeModal = () => {
    document.getElementById('modal-overlay').classList.remove('open');

    // iframe innerHTML 비워서 유튜브 재생 중단
    document.getElementById('modal-video').innerHTML = '';

    // 플레이 버튼 & 썸네일 원상 복원
    document.getElementById('modal-play').style.display = '';
    document.querySelector('.howto-modal__glyph').style.display = '';

    isPlaying = false;
  };

  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  /* ── MODAL PLAY LOGIC ─────────────────────────────────── */
  let isPlaying = false;

  document.getElementById('modal-play').addEventListener('click', () => {
    // 모달이 열려있고, 재생 중이 아닐 때만 실행
    if (!document.getElementById('modal-overlay').classList.contains('open')) return;
    if (isPlaying) return;

    // 플레이 버튼 & 썸네일 숨기기
    document.getElementById('modal-play').style.display = 'none';
    document.querySelector('.howto-modal__glyph').style.display = 'none';

    // iframe에 autoplay=1 추가하여 재생 시작
    const iframe = document.querySelector('#modal-video iframe');
    if (iframe) {
      iframe.src = iframe.src + '&autoplay=1';
    }
    isPlaying = true;
  });

  /* ── RENDER ────────────────────────────────────────────────────────────────── */
  function render(){ renderSidebar(); renderMain(); }

  render();

  /* swiper */
  let howtoSwiper = undefined;

  function initSwiper() {
    const ww = window.innerWidth;
    
    if (ww < 769) {
      if (howtoSwiper === undefined) {
        console.log('Swiper 초기화 (모바일)');
        howtoSwiper = new Swiper('.howto-nav__swiper.swiper', {
          slidesPerView: 'auto',
          loop: false,
          slideToClickedSlide: true,   
        });
      }
    } else {
      if (howtoSwiper !== undefined) {
        console.log('Swiper 제거 (PC)');
        howtoSwiper.destroy(true, true);
        howtoSwiper = undefined;
      } else {
        console.log('PC 화면 - Swiper 없음');
      }
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    initSwiper();
  });

  let resizeTimer;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      initSwiper();
    }, 100);
  });
